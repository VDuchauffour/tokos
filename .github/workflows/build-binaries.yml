name: Build binaries

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bin: tokos
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bin: tokos
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
            bin: tokos
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            bin: tokos
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: |
          cargo install cross
          cross build --release --target ${{ matrix.target }}
      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.bin }}-${{
          matrix.target }}.tar.gz ${{ matrix.bin }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.bin }}-${{ matrix.target
          }}.tar.gz" --clobber
