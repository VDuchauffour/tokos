[package]
name = "tokos"
version = "0.3.0"
edition = "2024"
description = "A lightweight terminal UI for real-time monitoring of inference server metrics."
license = "MIT"
repository = "https://github.com/VDuchauffour/tokos"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
clap = { version = "4", features = ["derive", "env"] }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[[bin]]
name = "tokos"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
